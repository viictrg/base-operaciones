<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Base de Operaciones · @victorapolo</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#1c1c1e; --bg2:#222225; --card:#28282b; --inset:#1f1f22; --hover:#313135; --line:rgba(255,255,255,.085);
    --txt:#f2f2f7; --mut:#98989f; --mut2:#636368;
    --acc:#dcff34; --acc-h:#e7ff63; --acc2:#ffd400; --accInk:#dcff34; --btn-ink:#1d1d1f;
    --accbg:rgba(220,255,52,.11); --accbd:rgba(220,255,52,.32);
    --blue:#409cff; --green:#30d158; --orange:#ff9f0a; --red:#ff6961; --pink:#ff6482; --purp:#bf5af2;
    --shadow:0 8px 28px rgba(0,0,0,.38); --shadow-sm:0 0 0 .5px rgba(0,0,0,.18),0 1px 2px rgba(0,0,0,.18);
    --row-ok:rgba(48,209,88,.09); --row-wait:rgba(255,159,10,.10);
    --radius:12px; color-scheme:dark;
  }
  html.light{
    --bg:#f5f5f7; --bg2:#ececee; --card:#ffffff; --inset:#f2f2f4; --hover:#e9e9eb; --line:rgba(0,0,0,.09);
    --txt:#1d1d1f; --mut:#6e6e73; --mut2:#aeaeb2;
    --acc:#d3ef1e; --acc-h:#ddf73d; --accInk:#5c6b00; --btn-ink:#1d1d1f;
    --accbg:rgba(170,200,0,.13); --accbd:rgba(150,180,0,.45);
    --blue:#0071e3; --green:#1faa4e; --orange:#e08a00; --red:#e0413a; --pink:#e0426b; --purp:#9d3fe0;
    --shadow:0 8px 24px rgba(20,30,55,.10); --shadow-sm:0 0 0 .5px rgba(0,0,0,.04),0 1px 2px rgba(16,24,40,.06);
    --row-ok:rgba(31,170,78,.10); --row-wait:rgba(224,138,0,.10);
    color-scheme:light;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Inter,system-ui,sans-serif;min-height:100vh;display:flex;transition:background .2s ease,color .2s ease;-webkit-font-smoothing:antialiased}
  ::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--mut2);border-radius:8px;border:2px solid transparent;background-clip:content-box}::-webkit-scrollbar-thumb:hover{background:var(--mut);background-clip:content-box}
  .card,.widget,.stat,table,.thumb{box-shadow:var(--shadow-sm)}

  /* SIDEBAR */
  .sidebar{width:218px;background:var(--bg2);border-right:1px solid var(--line);height:100vh;position:sticky;top:0;display:flex;flex-direction:column;padding:20px 10px;flex-shrink:0;-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
  .brand{font-weight:800;font-size:1.02rem;letter-spacing:-.4px;padding:0 10px 4px;line-height:1.15}
  .brand b{color:var(--accInk)}
  .brand small{display:block;color:var(--mut);font-size:.64rem;font-weight:500;letter-spacing:.6px;margin-top:4px;text-transform:uppercase}
  .nav{margin-top:22px;display:flex;flex-direction:column;gap:2px;flex:1}
  .nav button{display:flex;align-items:center;gap:10px;background:none;border:none;color:var(--txt);font-size:.85rem;font-weight:450;text-align:left;padding:7px 10px;border-radius:7px;cursor:pointer;transition:background .12s;font-family:inherit;width:100%}
  .nav button:hover{background:var(--hover)}
  .nav button.active{background:var(--accbg);color:var(--accInk);font-weight:600}
  .nav .ico{width:19px;height:19px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--mut)}
  .nav .ico svg{width:17px;height:17px;display:block}
  .nav button.active .ico{color:var(--accInk)}
  .nav .count{margin-left:auto;font-size:.68rem;font-variant-numeric:tabular-nums;background:none;color:var(--mut2);padding:1px 5px;border-radius:8px}
  .nav button.active .count{color:var(--accInk)}
  .side-foot .ico svg{width:16px;height:16px;display:block}
  .side-foot{border-top:1px solid var(--line);padding-top:12px;margin-top:8px}
  .sync-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:auto}
  .sync-cloud{background:var(--green);box-shadow:0 0 7px var(--green)}
  .sync-local{background:var(--orange);box-shadow:0 0 7px var(--orange)}

  /* MAIN */
  .main{flex:1;min-width:0;padding:28px 32px 80px;max-width:1320px}
  /* Finanzas aprovecha todo el ancho disponible (monitores ultrawide) */
  .main:has(.fin-stats){max-width:2400px}
  .main:has(.fin-stats) table{width:100%}
  .pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
  .pagehead h1{font-size:1.55rem;font-weight:700;letter-spacing:-.4px}
  .pagehead p{color:var(--mut);font-size:.84rem;margin-top:3px}
  .btn{background:var(--acc);color:var(--btn-ink);border:none;font-weight:600;font-size:.82rem;padding:8px 14px;border-radius:8px;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap;box-shadow:var(--shadow-sm)}
  .btn:hover{background:var(--acc-h)}
  .btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--txt);font-weight:500}
  .btn.ghost:hover{background:var(--hover)}
  .btn.sm{padding:5px 10px;font-size:.76rem}

  .chip{background:var(--inset);border:1px solid var(--line);border-radius:20px;padding:5px 13px;font-size:.78rem;color:var(--mut);cursor:pointer;transition:.15s;user-select:none}
  .chip:hover{color:var(--txt)}
  .chip.active{background:var(--accbg);border-color:var(--accbd);color:var(--accInk);font-weight:600}
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}

  /* Segmented control (macOS) */
  .sub-tabs{display:inline-flex;gap:2px;margin-bottom:20px;background:var(--inset);border:1px solid var(--line);border-radius:9px;padding:2px}
  .sub-tabs button{background:none;border:none;color:var(--mut);padding:6px 14px;font-size:.82rem;font-weight:500;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px;border-radius:7px;transition:.13s}
  .sub-tabs button.active{color:var(--txt);background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.18),0 0 0 .5px var(--line)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;transition:.15s;cursor:pointer}
  .card:hover{border-color:var(--mut2);box-shadow:var(--shadow)}
  .card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:11px}
  .badge{font-size:.66rem;font-weight:700;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
  .card-title{font-size:.98rem;font-weight:700;line-height:1.35;margin-bottom:7px}
  .card-desc{font-size:.8rem;color:var(--mut);line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .card-foot{margin-top:13px;padding-top:11px;border-top:1px solid var(--line);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .tag{font-size:.67rem;background:var(--inset);color:var(--mut);padding:2px 8px;border-radius:6px}
  .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-left:auto}
  .has-script{font-size:.65rem;color:var(--accInk);margin-left:auto}
  .add-card{border:2px dashed var(--line);background:none;border-radius:var(--radius);min-height:130px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--mut2);font-size:.85rem;cursor:pointer;transition:.15s}
  .add-card:hover{border-color:var(--accInk);color:var(--accInk)}
  .sel{background:transparent;border:1px solid var(--line);border-radius:8px;padding:3px 7px;font-size:.7rem;color:var(--mut);cursor:pointer;outline:none;font-family:inherit}
  .sel option{background:var(--bg2)}

  /* GALLERY */
  .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .thumb{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:.18s;cursor:pointer}
  .thumb:hover{transform:translateY(-2px);border-color:var(--mut2)}
  .thumb .img{aspect-ratio:16/9;background:var(--line) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--mut2);font-size:.75rem}
  .thumb.ref .img{aspect-ratio:9/16}
  .thumb-body{padding:11px 13px}
  .thumb-body h4{font-size:.84rem;font-weight:600;line-height:1.3;margin-bottom:3px}
  .thumb-body span{font-size:.72rem;color:var(--mut)}

  /* FINANZAS */
  .stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:13px;margin-bottom:24px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat .lbl{font-size:.7rem;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;font-weight:500}
  .stat .val{font-size:1.45rem;font-weight:700;margin-top:6px;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
  .fin-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:24px}
  .fin-stats .b2{grid-column:span 2}
  .fin-stats .val.xl{font-size:2rem}
  @media(max-width:860px){.fin-stats{grid-template-columns:repeat(2,1fr)}.fin-stats .b2{grid-column:span 2}}
  /* Ultrawide: más columnas de tarjetas en vez de estirarlas. Deben ir DESPUÉS
     de la regla base .fin-stats o la cascada las anula (las media queries no suman especificidad). */
  @media(min-width:1560px){.fin-stats{grid-template-columns:repeat(5,1fr)}}
  @media(min-width:2000px){.fin-stats{grid-template-columns:repeat(6,1fr)}}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  th{text-align:left;font-size:.67rem;text-transform:uppercase;letter-spacing:.5px;font-weight:600;color:var(--mut);padding:7px 10px;border-bottom:1px solid var(--line);background:var(--inset)}
  td{padding:5px 10px;border-bottom:1px solid var(--line);font-size:.82rem}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:var(--hover)}
  tr.row-cobrado td{background:var(--row-ok)}
  tr.row-pendiente td{background:var(--row-wait)}
  .pill{font-size:.68rem;padding:2px 9px;border-radius:20px;font-weight:600}
  .num{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;white-space:nowrap}
  .pos{color:var(--green)} .neg{color:var(--red)}
  .mini-btn{background:var(--inset);border:1px solid var(--line);color:var(--mut);cursor:pointer;font-size:.72rem;padding:3px 9px;border-radius:7px;transition:.15s}
  .mini-btn:hover{color:var(--accInk);border-color:var(--accbd)}
  .drag-h{cursor:grab;color:var(--mut2);user-select:none;text-align:center;width:24px;font-size:1rem}
  .drag-h:active{cursor:grabbing}
  tr.gdrag-over td{border-top:2px solid var(--accInk)}
  .pbar{height:12px;border-radius:8px;background:var(--inset);overflow:hidden;border:1px solid var(--line)}
  .pbar-fill{height:100%;border-radius:8px;transition:width .4s ease}
  details.gfut{margin:4px 0;border:1px solid var(--line);border-radius:8px;padding:7px 10px}
  details.gfut summary{cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;list-style:none}
  details.gfut summary::-webkit-details-marker{display:none}
  details.gfut[open] summary{margin-bottom:4px}
  .notes-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
  @media(max-width:900px){.notes-grid{grid-template-columns:1fr}}
  .note-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 17px;display:flex;flex-direction:column;min-height:190px}
  .note-card.drag-over{border-color:var(--accbd);background:var(--accbg)}
  .note-card h4{font-size:.95rem;font-weight:800;margin-bottom:11px;display:flex;align-items:center;gap:7px;letter-spacing:.2px}
  .note-add{width:100%;background:transparent;border:none;border-bottom:1px solid var(--line);color:var(--txt);font-size:.92rem;padding:7px 2px;margin-bottom:6px;outline:none}
  .note-add:focus{border-bottom-color:var(--accInk)}
  .note-add::placeholder{color:var(--mut2)}
  .note-item{display:flex;align-items:flex-start;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line)}
  .note-item:last-child{border-bottom:none}
  .note-item .ntxt{flex:1;font-size:.92rem;line-height:1.38;word-break:break-word}
  .note-item.done .ntxt{text-decoration:line-through;color:var(--mut2)}
  .note-item .nx{opacity:0;background:none;border:none;color:var(--mut2);cursor:pointer;font-size:.85rem;flex:none}
  .note-item:hover .nx{opacity:1}
  .note-check{appearance:none;-webkit-appearance:none;width:19px;height:19px;border:1.6px solid var(--mut2);border-radius:50%;cursor:pointer;flex:none;margin-top:1px;position:relative;transition:.12s}
  .note-check:checked{background:var(--accInk);border-color:var(--accInk)}
  .note-check:checked::after{content:'✓';position:absolute;color:#fff;font-size:.72rem;font-weight:700;left:3px;top:0}
  .afil-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
  .afil-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px;display:flex;flex-direction:column;gap:7px}
  .afil-name{font-weight:700;font-size:.9rem}
  .afil-url{font-size:.76rem;color:var(--mut2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .afil-actions{display:flex;gap:8px;align-items:center;margin-top:2px}
  .ref-quick{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}
  .ref-qbtn{display:inline-flex;align-items:center;gap:8px;background:var(--accbg);border:1px solid var(--accbd);color:var(--accInk);text-decoration:none;font-weight:700;font-size:.86rem;padding:11px 16px;border-radius:11px;transition:.14s}
  .ref-qbtn:hover{background:var(--accInk);color:#fff;transform:translateY(-1px)}
  .ref-block{margin-bottom:18px}
  .ref-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px}
  .ref-h h3{font-size:.95rem;font-weight:800;letter-spacing:.2px}
  .ref-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
  @media(max-width:900px){.ref-cols{grid-template-columns:1fr}}
  .ref-profiles{display:flex;flex-wrap:wrap;gap:9px}
  .ref-grid{display:flex;flex-direction:column;gap:10px}
  .ref-card{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;align-items:center}
  .ref-cover{width:88px;height:88px;border-radius:9px;background:var(--inset) center/cover no-repeat;flex:none;display:flex;align-items:center;justify-content:center;font-size:1.6rem;text-decoration:none;overflow:hidden}
  .ref-cbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .ref-title{color:var(--txt);font-weight:600;font-size:.9rem;text-decoration:none;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ref-title:hover{color:var(--accInk)}
  .ref-sub{font-size:.78rem;color:var(--mut2)}
  .ref-actions{display:flex;gap:6px;align-items:center;margin-top:3px}
  .ref-prof{font-size:.74rem;color:var(--accInk);text-decoration:none;border:1px solid var(--accbd);padding:3px 8px;border-radius:7px;white-space:nowrap}
  .ref-chip{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 7px 6px 13px;font-size:.85rem}
  .ref-chip a{color:var(--txt);text-decoration:none;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ref-chip a:hover{color:var(--accInk)}
  .ref-chip .trow-x{font-size:.72rem}

  /* DASHBOARD */
  .dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
  .widget{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}
  .widget h3{font-size:.76rem;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin-bottom:11px;display:flex;align-items:center;gap:8px}
  .wlist{display:flex;flex-direction:column;gap:9px}
  .wrow{display:flex;align-items:center;gap:9px;font-size:.82rem;padding:4px 0;border-bottom:1px solid var(--line)}
  .wrow:last-child{border-bottom:none}
  .wrow .r-title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .empty{text-align:center;padding:60px 20px;color:var(--mut2);font-size:.88rem;grid-column:1/-1}
  /* TO-DO */
  .todo-add{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .todo-add input[type=text]{flex:1;min-width:180px;background:var(--inset);border:1px solid var(--line);border-radius:9px;padding:9px 12px;color:var(--txt);font-family:inherit;font-size:.86rem;outline:none}
  .todo-add input[type=text]:focus{border-color:var(--accInk)}
  .todo-add input[type=date],.todo-add input[type=time],.todo-add select{color-scheme:inherit}
  .trow{display:flex;align-items:center;gap:9px;padding:5px 0;border-bottom:1px solid var(--line)}
  .trow:last-child{border-bottom:none}
  .trow input[type=checkbox]{width:16px;height:16px;accent-color:var(--accInk);cursor:pointer;flex-shrink:0}
  .trow .ttext{flex:1;font-size:.84rem;min-width:0;line-height:1.35}
  .trow.done .ttext{text-decoration:line-through;color:var(--mut2)}
  .trow.done .dot{opacity:.4}
  .trow-x{background:none;border:none;color:var(--mut2);cursor:pointer;font-size:.85rem;flex-shrink:0;padding:2px 4px}
  .trow-x:hover{color:var(--red)}
  /* CELDAS EDITABLES (Finanzas estilo Excel) */
  .fcell{background:var(--inset);border:1px solid var(--line);border-radius:6px;padding:3px 7px;color:var(--txt);font-family:inherit;font-size:.8rem;outline:none;max-width:100%}
  .fcell:focus{border-color:var(--acc)}
  td .fcell[type=number]{text-align:right}
  tfoot td{padding:11px 14px;border-top:2px solid var(--line);font-size:.85rem}
  /* VIEW TOGGLE + LISTA + DRAG */
  .viewtoggle{display:flex;gap:2px;background:var(--inset);border:1px solid var(--line);border-radius:9px;padding:3px}
  .viewtoggle button{background:none;border:none;color:var(--mut);font-size:.78rem;padding:5px 10px;border-radius:7px;cursor:pointer;font-family:inherit}
  .viewtoggle button.active{background:var(--accbg);color:var(--accInk);font-weight:600}
  .idea-list{display:flex;flex-direction:column;gap:7px}
  .idea-row{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 14px;cursor:pointer;transition:.15s}
  .idea-row:hover{border-color:var(--mut2)}
  .idea-row .ir-title{flex:1;min-width:0;font-size:.9rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .drag-grip{color:var(--mut2);cursor:grab;font-size:.9rem;flex-shrink:0}
  .card[draggable="true"]{cursor:pointer}
  .card.drag-over,.idea-row.drag-over{border-color:var(--accInk);box-shadow:0 0 0 2px var(--accbd)}

  /* EDITOR (Notion-style) */
  .editor{max-width:820px}
  .ed-back{background:none;border:none;color:var(--mut);font-size:.84rem;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:7px;margin-bottom:18px;padding:6px 0}
  .ed-back:hover{color:var(--txt)}
  .ed-save{font-size:.74rem;color:var(--mut2);margin-left:auto}
  .ed-save.on{color:var(--green)}
  .ed-title{width:100%;background:none;border:none;outline:none;color:var(--txt);font-size:1.9rem;font-weight:700;letter-spacing:-.6px;font-family:inherit;line-height:1.2;margin-bottom:6px}
  .ed-title::placeholder{color:var(--mut2)}
  .ed-sub{width:100%;background:none;border:none;outline:none;color:var(--mut);font-size:1rem;font-family:inherit;margin-bottom:18px}
  .ed-sub::placeholder{color:var(--mut2)}
  .ed-meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:22px}
  .ed-meta .mlbl{font-size:.7rem;color:var(--mut2);text-transform:uppercase;letter-spacing:.5px;margin-right:2px}
  .ed-body{width:100%;background:none;border:none;outline:none;color:var(--txt);font-size:.96rem;line-height:1.75;font-family:inherit;resize:none;min-height:50vh;overflow:hidden}
  .ed-body::placeholder{color:var(--mut2)}
  .ed-del{background:none;border:1px solid #7f1d1d;color:var(--red);padding:8px 14px;border-radius:9px;cursor:pointer;font-size:.8rem;font-family:inherit;margin-top:30px}
  .ed-del:hover{background:#7f1d1d33}

  /* CALENDAR */

function migrate(){
  if(CLOUD)return;
  let changed=false;
  (cache.ideas||[]).forEach(i=>{
    if(!i.seccion){
      if(i.categoria==='youtube'){i.seccion='youtube';i.categoria='tutorial';}
      else{i.seccion='reel';i.categoria=(i.categoria==='colaboracion')?'colab':'organico';}
      changed=true;
    }
    if(i.contenido===undefined){i.contenido='';changed=true;}
    if(i.fecha_pub===undefined){i.fecha_pub=null;changed=true;}
  });
  // importar guiones antiguos como contenido si existieran
  const oldG=JSON.parse(localStorage.getItem('baseops_guiones')||'[]');
  if(oldG.length){oldG.forEach(g=>{const idea=(cache.ideas||[]).find(i=>i.id===g.idea_id);if(idea&&!idea.contenido)idea.contenido=g.contenido||'';});localStorage.removeItem('baseops_guiones');changed=true;}
  (cache.referencias||[]).forEach(r=>{if(!r.seccion){r.seccion='reel';changed=true;}});
  if(changed){localStorage.setItem('baseops_ideas',JSON.stringify(cache.ideas));localStorage.setItem('baseops_referencias',JSON.stringify(cache.referencias));}
}

function renderDashCalHTML(){
  const y=dashCal.getFullYear(),m=dashCal.getMonth();
  const monthName=dashCal.toLocaleDateString('es-ES',{month:'long',year:'numeric'});
  const first=new Date(y,m,1);let start=(first.getDay()+6)%7;const dim=new Date(y,m+1,0).getDate();
  const today=todayISO();
  const tareas=cache.tareas||[],ideas=cache.ideas||[],creds=(cache.recursos||[]).filter(r=>r.tipo==='credito');
  const dows=['L','M','X','J','V','S','D'];
  // Agrupar eventos multi-día por nombre -> {min,max,color}
  const evMap={};
  tareas.filter(t=>t.prioridad==='evento').forEach(t=>{const k=t.texto;if(!evMap[k])evMap[k]={texto:t.texto,min:t.fecha,max:t.fecha,color:eventColor(t.texto)};if(t.fecha<evMap[k].min)evMap[k].min=t.fecha;if(t.fecha>evMap[k].max)evMap[k].max=t.fecha;});
  const events=Object.values(evMap);
  const BAR=16; // alto de banda por evento
  const totalCells=start+dim; const numWeeks=Math.ceil(totalCells/7);
  let weeks='';
  for(let w=0;w<numWeeks;w++){
    const wd=[]; for(let c=0;c<7;c++){const dn=w*7+c-start+1; wd.push((dn<1||dn>dim)?null:ymd(y,m,dn));}
    // Segmentos de evento dentro de esta semana (barra continua)
    const segs=[];
    events.forEach(e=>{let cs=-1,ce=-1;for(let c=0;c<7;c++){const ds=wd[c];if(ds&&ds>=e.min&&ds<=e.max){if(cs<0)cs=c;ce=c;}}if(cs>=0)segs.push({e,cs,ce,lr:wd[cs]===e.min,rr:wd[ce]===e.max});});
    segs.sort((a,b)=>a.cs-b.cs||b.ce-a.ce);
    const laneEnd=[]; segs.forEach(s=>{let l=0;while(laneEnd[l]!==undefined&&laneEnd[l]>=s.cs)l++;laneEnd[l]=s.ce;s.lane=l;});
    const reserve=laneEnd.length*BAR;
    // Celdas de día
    let cellsW='';
    for(let c=0;c<7;c++){
      const ds=wd[c];
      if(!ds){cellsW+='<div class="cal-cell other"></div>';continue;}
      const dn=Number(ds.slice(8,10)); const arrC=[];
      ideas.filter(i=>i.fecha_pub===ds).forEach(i=>{const c2=catColor(i.seccion,i.categoria);arrC.push(`<div class="cal-chip" draggable="true" ondragstart="draggedId='${i.id}';draggedKind='idea';event.stopPropagation()" onclick="event.stopPropagation();openIdeaFrom('${i.id}')" style="background:${c2}22;border-color:${c2};color:${c2}" title="${esc(i.titulo)} · arrastra para mover">${esc(i.titulo)||'Sin título'}</div>`);});
      tareas.filter(t=>t.fecha===ds&&t.prioridad!=='evento').forEach(t=>{arrC.push(`<div class="cal-chip" draggable="true" ondragstart="draggedId='${t.id}';draggedKind='tarea';event.stopPropagation()" onclick="event.stopPropagation();toggleTarea('${t.id}')" style="background:var(--accbg);border-color:var(--accbd);color:var(--accInk);${t.hecha?'text-decoration:line-through;opacity:.55':''}" title="${esc(t.texto)} · clic: hecha/pendiente · arrastra para mover">${esc(t.texto)}</div>`);});
      creds.filter(r=>credParse(r).dia===dn).forEach(r=>{arrC.push(`<div class="cal-chip" style="background:var(--inset);border-color:var(--mut2);color:var(--mut);cursor:default" title="Renueva créditos">💳 ${esc(r.titulo)}</div>`);});
      // celda de altura FIJA: se muestran las fichas que caben y el resto va a "+N más"
      const avail=118-26-reserve, maxN=Math.max(0,Math.floor(avail/20));
      let shown=arrC,extra=0;
      if(arrC.length>maxN){const keep=Math.max(0,maxN-1);shown=arrC.slice(0,keep);extra=arrC.length-keep;}
      const chips=shown.join('')+(extra?`<div class="cal-chip more" onclick="event.stopPropagation();openDayModal('${ds}')" title="Ver todo el día">+${extra} más</div>`:'');
      cellsW+=`<div class="cal-cell ${ds===today?'today':''}" onclick="addTareaOn('${ds}')" ondragover="event.preventDefault();this.classList.add('drop')" ondragleave="this.classList.remove('drop')" ondrop="agDrop(event,'${ds}',this)" title="Clic: nueva tarea · suelta aquí una idea para programarla"><div class="cal-daynum">${dn}</div>${reserve?`<div style="height:${reserve}px;flex:none"></div>`:''}${chips}</div>`;
    }
    // Barras de evento (continuas)
    let bars='';
    segs.forEach(s=>{const left=(s.cs/7)*100,wpc=((s.ce-s.cs+1)/7)*100;const li=s.lr?3:0,ri=s.rr?3:0;const rl=s.lr?6:0,rr=s.rr?6:0;bars+=`<div class="cal-bar" style="left:calc(${left}% + ${li}px);width:calc(${wpc}% - ${li+ri}px);top:${s.lane*BAR}px;background:${s.e.color}2b;border-color:${s.e.color};color:${s.e.color};border-radius:${rl}px ${rr}px ${rr}px ${rl}px" title="${esc(s.e.texto)}">${s.lr?esc(s.e.texto):'&nbsp;'}</div>`;});
    weeks+=`<div class="cal-week"><div class="cal-week-row">${cellsW}</div><div class="cal-bars">${bars}</div></div>`;
  }
  return `<div class="widget" style="margin-bottom:16px">
    <div class="cal-head"><h3 style="margin:0;text-transform:capitalize;color:var(--txt);font-size:1rem;letter-spacing:0">${monthName}</h3>
      <button class="cal-nav" onclick="dashCalMove(-1)">‹</button><button class="cal-nav" onclick="dashCalMove(1)">›</button>
      <button class="btn ghost sm" onclick="dashCalToday()">Hoy</button>
      <span style="margin-left:auto;font-size:.72rem;color:var(--mut2)">Clic en un día para añadir tarea</span></div>
    <div class="cal-dows" style="margin-top:12px">${dows.map(x=>`<div class="cal-dow">${x}</div>`).join('')}</div>
    <div class="cal-weeks">${weeks}</div>
  </div>`;
}

function kbDropAt(ev,sec){
  ev.preventDefault();
  const cols=[...document.querySelectorAll('.kb .kb-col')],ests=Object.keys(EST);
  let best=-1,bd=Infinity;
  cols.forEach((c,i)=>{const r=c.getBoundingClientRect();
    const dx=ev.clientX<r.left?r.left-ev.clientX:(ev.clientX>r.right?ev.clientX-r.right:0);
    const dy=ev.clientY<r.top?r.top-ev.clientY:(ev.clientY>r.bottom?ev.clientY-r.bottom:0);
    const d=dx*dx+dy*dy;if(d<bd){bd=d;best=i;}});
  if(best>-1)kbDropCol(ests[best],sec);
}

/* ---- Importar link desde el portapapeles ---- */
function refDest(u){const s=(u||'').toLowerCase();
  if(/youtu\.be\/|youtube\.com/.test(s)){
    if(/\/shorts\//.test(s))return{sec:'hub_reels',plat:'youtube'};
    if(/watch\?|youtu\.be\/|\/embed\//.test(s))return{sec:'hub_youtube',plat:'youtube'};
    return{sec:'hub_perfiles',plat:'youtube'};                      // canal @usuario
  }
  if(/instagram\.com/.test(s)){
    if(/\/(reel|reels|p|tv)\//.test(s))return{sec:'hub_reels',plat:'instagram'};
    return{sec:'hub_perfiles',plat:'instagram'};                    // perfil
  }
  if(/tiktok\.com/.test(s)){
    if(/\/video\/|\/photo\//.test(s))return{sec:'hub_reels',plat:'tiktok'};
    return{sec:'hub_perfiles',plat:'tiktok'};                       // perfil
  }
  return{sec:'hub_youtube',plat:'otro'};}
function handleFromUrl(url,plat){
  if(plat==='instagram'){const m=url.match(/instagram\.com\/([\w.\-]+)\/?/i);if(m&&!['reel','reels','p','tv','stories','explore'].includes(m[1].toLowerCase()))return '@'+m[1];}
  if(plat==='tiktok'){const m=url.match(/tiktok\.com\/(@[\w.\-]+)/i);if(m)return m[1];}
  if(plat==='youtube'){const m=url.match(/youtube\.com\/(@[\w.\-]+)/i);if(m)return m[1];}
  return '';}
async function ensureProfile(autor,purl,plat){
  if(!autor)return;
  const norm=s=>(s||'').toLowerCase().replace(/^@/,'').trim();
  const ya=(cache.referencias||[]).some(r=>r.seccion==='hub_perfiles'&&(norm(r.autor)===norm(autor)||(purl&&r.url===purl)));
  if(ya)return;
  await db.insert('referencias',{seccion:'hub_perfiles',plataforma:plat||'youtube',titulo:autor,autor,url:purl||'',url_imagen:'',notas:'auto · del vídeo guardado',tags:[]});
  cache.referencias=await db.list('referencias');
}
async function saveRefUrl(url){
  const d=refDest(url);
  const row={seccion:d.sec,plataforma:d.plat,url,titulo:'',autor:handleFromUrl(url,d.plat),url_imagen:'',notas:'',tags:[]};
  let meta=null;
  if(d.plat!=='instagram'){ // noembed no cubre Instagram
    try{
      const r=await fetch('https://noembed.com/embed?url='+encodeURIComponent(url));
      const j=await r.json();
      if(j&&!j.error){meta=j;if(d.sec!=='hub_perfiles')row.titulo=j.title||'';row.autor=j.author_name||row.autor;if(j.thumbnail_url)row.url_imagen=j.thumbnail_url;}
    }catch(e){}
  }
  if(!row.url_imagen&&d.plat==='youtube'){const id=ytId(url);if(id)row.url_imagen='https://img.youtube.com/vi/'+id+'/hqdefault.jpg';}
  const ins=await db.insert('referencias',row);
  cache.referencias=await db.list('referencias');
  if(ins)recUndo(async()=>{await db.remove('referencias',ins.id);cache.referencias=await db.list('referencias');updateCounts();render();});
  if(d.sec==='hub_youtube'&&row.autor)await ensureProfile(row.autor,(meta&&meta.author_url)||'',d.plat); // el canal entra solo en Perfiles
  updateCounts();render();
  const dest={hub_reels:'Reels',hub_youtube:'YouTube',hub_perfiles:'Perfiles'}[d.sec]||'Referencias';
  if(d.plat==='instagram'&&d.sec==='hub_reels')toast(`Guardado en ${dest} ✓ — portada y texto se cargan de Instagram`);
  else toast(row.titulo||row.autor?`Guardado en ${dest} ✓`:`Guardado en ${dest} — título pendiente (pídeme que lo complete)`);
}
async function addLinkFromClipboard(){
  const btn=document.getElementById('pasteBtn');
  if(btn){btn.disabled=true;btn.textContent='Importando…';}
  let txt='';
  try{txt=await navigator.clipboard.readText();}catch(e){}
  let m=(txt||'').match(/https?:\/\/\S+/);
  if(!m){const p=prompt('No he podido leer el portapapeles. Pega el link aquí:')||'';m=p.match(/https?:\/\/\S+/);}
  if(!m){toast('No hay ningún link copiado');render();return;}
  const url=m[0].replace(/[)\].,;'"]+$/,'');
  if((cache.referencias||[]).some(r=>r.url===url)){toast('Ese link ya está guardado');render();return;}
  if(refDest(url).sec==='hub_reels'){toast('Los reels guárdalos en tus Guardados de Instagram 📌');render();return;}
  await saveRefUrl(url);
}

let finTab='ingresos', finYear=new Date().getFullYear(), finPeriod='año';
const DEDUCE_IRPF=0.30; // tipo IRPF estimado para calcular ahorro por desgravar (orientativo)
function mMeta(m){try{const o=JSON.parse(m.notas||'{}');return (o&&typeof o==='object')?o:{};}catch(e){return {};}}
function irpfAmt(m){return mMeta(m).irpf?(Number(m.importe)||0)*0.15:0;}
function brutoIng(m){return (Number(m.importe)||0)+ivaOf(m)-irpfAmt(m);}
function netoIng(m){return (Number(m.importe)||0)-irpfAmt(m);}
function totalGasto(m){return (Number(m.importe)||0)+ivaOf(m);}
function reservaFor(ingArr,gas){
  const ivaR=ingArr.reduce((s,m)=>s+ivaOf(m),0), ivaS=gas.reduce((s,m)=>s+ivaOf(m),0);
  const bIng=ingArr.reduce((s,m)=>s+(Number(m.importe)||0),0);
  const bGas=gas.filter(m=>!m.amort).reduce((s,m)=>s+(Number(m.importe)||0),0);
  const amY=gas.filter(m=>m.amort).reduce((s,m)=>s+amortAnual(m),0);
  const ret=ingArr.reduce((s,m)=>s+irpfAmt(m),0);
  return Math.max(0,ivaR-ivaS)+Math.max(0,(bIng-bGas-amY)*0.20-ret);
}
/* IRPF que TODAVÍA debes por esta factura: 20% de pago fraccionado sobre la base,
   menos lo que el cliente ya te retuvo. No incluye IVA a propósito: se aplica sobre
   netoIng(), que ya es base sin IVA — sumarlo aquí lo restaría dos veces. */
function pesoFiscal(m){const base=Number(m.importe)||0;return Math.max(0,base*0.20-irpfAmt(m));}

  if(['importe','iva','amort_anios'].includes(field))value=parseFloat(value)||0;
  const isMeta=['factura','irpf','nota','hasta','desg','hecho','fenv'].includes(field);
  const oldNotas=m.notas,oldVal=m[field];
  if(isMeta){const me=mMeta(m);me[field]=value;m.notas=JSON.stringify(me);await db.update('movimientos',id,{notas:m.notas});}
  else{m[field]=value;await db.update('movimientos',id,{[field]:value});}
  recUndo(async()=>{await db.update('movimientos',id,isMeta?{notas:oldNotas}:{[field]:oldVal});cache.movimientos=await db.list('movimientos');renderFinanzas();});
  renderFinanzas();
}

function impDelAno(i,yr){const p=String(i.periodo||'');return p.startsWith(String(yr))||(!p&&yOf(i.fecha_limite)===yr);}

async function m130Set(q,field,value,calcAmt){

  if(!r){
    /* Al marcar pagado sin importe, se rellena con lo calculado: si no, quedaría
       en 0 y el total de adelantos no se movería (parecería que no hace nada). */
    const imp=field==='importe'?v:(v===true?suger:0);

function renderResumen(){

  const gas=mov.filter(m=>m.tipo==='gasto'&&yOf(m.fecha)===yr);
  const Q={};for(let q=1;q<=4;q++)Q[q]={ing:0,ivaR:0,gas:0,ivaS:0,reten:0,amort:0};
  ing.forEach(m=>{const q=qOf(m.fecha);Q[q].ing+=Number(m.importe)||0;Q[q].ivaR+=ivaOf(m);Q[q].reten+=irpfAmt(m);});
  gas.forEach(m=>{const q=qOf(m.fecha);Q[q].ivaS+=ivaOf(m);if(m.amort)Q[q].amort+=amortAnual(m);else Q[q].gas+=Number(m.importe)||0;});
  let acc=0,iY=0,gY=0,aY=0,rY=0;const m130={};
  for(let q=1;q<=4;q++){iY+=Q[q].ing;gY+=Q[q].gas;aY+=Q[q].amort;rY+=Q[q].reten;const ben=iY-gY-aY;const due=Math.max(0,ben*0.20-rY);const pay=Math.max(0,due-acc);acc+=pay;m130[q]=pay;}
  const row=q=>{const iva303=Q[q].ivaR-Q[q].ivaS;const ben=Q[q].ing-Q[q].gas-Q[q].amort;return `<tr>
    <td><b>T${q}</b></td><td class="num">${eur(Q[q].ing)}</td><td class="num">${eur(Q[q].ivaR)}</td><td class="num">${eur(Q[q].gas+Q[q].amort)}</td><td class="num">${eur(Q[q].ivaS)}</td>

    <td class="num">${eur(Q[q].reten)}</td><td class="num">${eur(ben)}</td><td class="num" style="color:${m130[q]>0?'var(--orange)':'var(--mut)'}">${eur(m130[q])}</td></tr>`;};
  const ingA=iY,gasA=gY,benA=iY-gY-aY,irpf=Math.max(0,irpfEstimate(Math.max(0,benA))-MIN_PERSONAL*0.19);
  $('#finBody').innerHTML=`

  </tr></thead><tbody>${[1,2,3,4].map(row).join('')}</tbody>
  <tfoot><tr><td><b>Año</b></td><td class="num"><b>${eur(ingA)}</b></td><td class="num">${eur(Q[1].ivaR+Q[2].ivaR+Q[3].ivaR+Q[4].ivaR)}</td><td class="num"><b>${eur(gasA+aY)}</b></td><td class="num">${eur(Q[1].ivaS+Q[2].ivaS+Q[3].ivaS+Q[4].ivaS)}</td><td class="num"></td><td class="num">${eur(rY)}</td><td class="num"><b>${eur(benA)}</b></td><td class="num"><b>${eur(acc)}</b></td></tr></tfoot>
  </table></div>
  <div class="dash-grid" style="margin-top:18px">
    <div class="widget"><h3>🧮 Renta anual estimada ${yr}</h3><div class="wlist">
      <div class="wrow"><span class="r-title">Beneficio neto (ingresos − gastos − amort.)</span><span class="num ${benA>=0?'pos':'neg'}">${eur(benA)}</span></div>
      <div class="wrow"><span class="r-title">IRPF estimado (tramos)</span><span class="num" style="color:var(--orange)">${eur(irpf)}</span></div>
      <div class="wrow"><span class="r-title">Retenciones ya aplicadas (−)</span><span class="num">${eur(rY)}</span></div>
      <div class="wrow"><span class="r-title">Pagos fraccionados 130 (−)</span><span class="num">${eur(acc)}</span></div>
      <div class="wrow"><span class="r-title"><b>Quedaría por pagar en renta ~</b></span><span class="num" style="color:var(--accInk)">${eur(Math.max(0,irpf-rY-acc))}</span></div>
    </div></div>
    <div class="widget"><h3>ℹ️ Notas</h3><div style="font-size:.83rem;color:var(--mut);line-height:1.75">
      • <b>303 (IVA):</b> IVA que cobras − IVA que pagas. Si sale negativo, queda a tu favor (compensación).<br>

      • Cuando presentes las declaraciones, pásame el PDF y ajusto los importes reales.

  </div>`;
}

/* ── AMORTIZACIONES ── */
function renderAmortTable(){
  const assets=(cache.movimientos||[]).filter(m=>m.tipo==='gasto'&&m.amort);
  const total=assets.reduce((s,m)=>s+(Number(m.importe)||0),0);
  const cuota=assets.reduce((s,m)=>s+amortAnual(m),0);
  $('#finBody').innerHTML=`
  <div class="banner">📷 El material &gt;300€ no se deduce de golpe: se reparte en varios años (amortización). Aquí ves la parte deducible cada año. <b>Estimación orientativa.</b></div>
  <div class="stats-row">
    <div class="stat"><div class="lbl">Inversión en material</div><div class="val">${eur(total)}</div></div>
    <div class="stat"><div class="lbl">Deducible/año (cuota)</div><div class="val pos">${eur(cuota)}</div></div>
    <div class="stat"><div class="lbl">Activos</div><div class="val">${assets.length}</div></div>
  </div>
  <table><thead><tr><th>Concepto</th><th>Compra</th><th class="num">Base</th><th>Años</th><th class="num">Cuota/año</th><th>Periodo</th><th></th></tr></thead><tbody>
  ${assets.length?assets.map(m=>{const y0=yOf(m.fecha||todayISO());const a=Number(m.amort_anios)||4;return `<tr><td>${esc(m.concepto)}</td><td>${fdate(m.fecha)}</td><td class="num">${eur(m.importe)}</td><td>${a}</td><td class="num pos">${eur(amortAnual(m))}</td><td style="color:var(--mut)">${y0}–${y0+a-1}</td><td><button class="mini-btn" onclick="openForm('movimientos','${m.id}')">✏️</button></td></tr>`;}).join(''):'<tr><td colspan="7" style="text-align:center;color:var(--mut2);padding:40px">Sin material amortizable. Al registrar un gasto &gt;300€ se marca solo aquí.</td></tr>'}
  </tbody></table>`;
}

/* ── RESUMEN FISCAL (estimación orientativa) ── */
let fiscalYear=new Date().getFullYear();
function renderFiscal(){
  const mov=cache.movimientos||[];const yr=fiscalYear;
  const Q={1:{ing:0,gas:0,ivaR:0,ivaS:0},2:{ing:0,gas:0,ivaR:0,ivaS:0},3:{ing:0,gas:0,ivaR:0,ivaS:0},4:{ing:0,gas:0,ivaR:0,ivaS:0}};
  mov.forEach(m=>{if(!m.fecha||yOf(m.fecha)!==yr)return;const q=qOf(m.fecha);
    if(m.tipo==='ingreso'){Q[q].ing+=Number(m.importe)||0;Q[q].ivaR+=ivaOf(m);}
    else{Q[q].ivaS+=ivaOf(m);if(!m.amort)Q[q].gas+=Number(m.importe)||0;}});
  const amortYear=mov.filter(m=>m.tipo==='gasto'&&m.amort).filter(m=>{const y0=yOf(m.fecha);return yr>=y0&&yr<=y0+(Number(m.amort_anios)||4)-1;}).reduce((s,m)=>s+amortAnual(m),0);
  let acc130=0,ingYTD=0,gasYTD=0;const m130={};
  for(let q=1;q<=4;q++){ingYTD+=Q[q].ing;gasYTD+=Q[q].gas;const amortYTD=amortYear*q/4;const ben=ingYTD-gasYTD-amortYTD;const due=Math.max(0,ben*0.20);const pay=Math.max(0,due-acc130);acc130+=pay;m130[q]=pay;}
  const ingA=Q[1].ing+Q[2].ing+Q[3].ing+Q[4].ing, gasA=Q[1].gas+Q[2].gas+Q[3].gas+Q[4].gas;
  const ben=ingA-gasA-amortYear, irpf=Math.max(0,irpfEstimate(Math.max(0,ben))-MIN_PERSONAL*0.19);
  const cards=[1,2,3,4].map(q=>{const iva303=Q[q].ivaR-Q[q].ivaS;return `<div class="stat"><div class="lbl">T${q} · ${yr}</div>
    <div style="font-size:.72rem;color:var(--mut);margin-top:9px">Modelo 130 (IRPF)</div><div class="val" style="font-size:1.15rem;color:${m130[q]>0?'var(--orange)':'var(--green)'}">${eur(m130[q])}</div>
    <div style="font-size:.72rem;color:var(--mut);margin-top:9px">Modelo 303 (IVA)</div><div class="val" style="font-size:1.15rem;color:${iva303>=0?'var(--orange)':'var(--green)'}">${iva303<0?'a favor ':''}${eur(Math.abs(iva303))}</div></div>`;}).join('');
  $('#finBody').innerHTML=`
  <div class="banner">⚠️ <b>Estimación orientativa, no es asesoramiento fiscal.</b> Asume estimación directa, IVA 21% y pago fraccionado 20%. Confírmalo siempre con tu gestor.</div>
  <div class="cal-head"><button class="cal-nav" onclick="fiscalYear--;renderFiscal()">‹</button><h2>Año ${yr}</h2><button class="cal-nav" onclick="fiscalYear++;renderFiscal()">›</button></div>
  <div class="stats-row" style="grid-template-columns:repeat(4,1fr)">${cards}</div>
  <div class="dash-grid" style="margin-top:6px">
    <div class="widget"><h3>🧮 Renta anual estimada ${yr}</h3><div class="wlist">
      <div class="wrow"><span class="r-title">Ingresos</span><span class="num pos">${eur(ingA)}</span></div>
      <div class="wrow"><span class="r-title">Gastos corrientes</span><span class="num neg">${eur(gasA)}</span></div>
      <div class="wrow"><span class="r-title">Amortización material</span><span class="num neg">${eur(amortYear)}</span></div>
      <div class="wrow"><span class="r-title"><b>Beneficio neto</b></span><span class="num ${ben>=0?'pos':'neg'}">${eur(ben)}</span></div>
      <div class="wrow"><span class="r-title">IRPF estimado (tramos)</span><span class="num" style="color:var(--orange)">${eur(irpf)}</span></div>
      <div class="wrow"><span class="r-title">Pagos a cuenta 130 del año</span><span class="num">${eur(acc130)}</span></div>
      <div class="wrow"><span class="r-title"><b>Quedaría por pagar ~</b></span><span class="num" style="color:var(--accInk)">${eur(Math.max(0,irpf-acc130))}</span></div>
    </div></div>
    <div class="widget"><h3>ℹ️ Lo que debes saber</h3><div style="font-size:.83rem;color:var(--mut);line-height:1.75">
      • El <b>modelo 130</b> solo es obligatorio si <b>menos del 70%</b> de tus ingresos llevan retención de IRPF. Si casi todo es de empresas que te retienen, normalmente NO lo presentas.<br>
      • Como tienes <b>mezcla</b>, te muestro el 130 estimado por si te toca. Las retenciones que ya te aplican se descuentan luego en la renta.<br>
      • El IRPF anual usa los tramos estatales aproximados menos el mínimo personal (5.550€). Es una guía, no el cálculo oficial.<br>
      • Cuando hagas las declaraciones reales, <b>pásame el PDF</b> y actualizo los importes oficiales en la pestaña <b>Impuestos</b>.
    </div></div>
  </div>`;
}

/* ============================================================
   FORM ENGINE (recursos / referencias / miniaturas / finanzas)
   ============================================================ */
const FORMS={
  recursos:{title:'Recurso',fields:[['titulo','Título','text',1],['url','URL','text'],['tipo','Tipo','select',0,[['herramienta','Herramienta'],['preset','Preset'],['asset','Asset'],['link','Link'],['otro','Otro']]],['notas','Notas','textarea'],['tags','Tags (coma)','tags']]},
  referencias:{title:'Referencia',fields:[['titulo','Título','text'],['url','URL','text'],['url_imagen','URL imagen/preview','text'],['plataforma','Plataforma','select',0,[['instagram','Instagram'],['tiktok','TikTok'],['youtube','YouTube'],['otro','Otro']]],['autor','Autor','text'],['notas','Notas','textarea'],['tags','Tags (coma)','tags']]},
  miniaturas:{title:'Miniatura',fields:[['titulo','Título','text'],['url_imagen','URL de la imagen','text'],['fuente','Fuente / autor','text'],['url_video','URL del vídeo','text'],['notas','Notas','textarea'],['tags','Tags (coma)','tags']]},
  movimientos:{title:'Movimiento',fields:[['concepto','Concepto','text',1],['tipo','Tipo','select',0,[['ingreso','💚 Ingreso'],['gasto','❤️ Gasto']]],['importe','Importe BASE sin IVA (€)','number',1],['iva','IVA %','number'],['fecha','Fecha','date'],['cliente','Cliente / proveedor','text'],['categoria','Categoría','select',0,[['cliente','Cliente'],['software','Software'],['equipo','Equipo / material'],['impuestos','Impuestos'],['general','General']]],['estado','Estado','select',0,[['cobrado','Cobrado'],['pendiente','Pendiente'],['pagado','Pagado'],['propuesta','Propuesta']]],['amort','Es amortización (material >300€: se deduce en varios años)','check'],['amort_anios','Años de amortización','number'],['notas','Notas','textarea']]},
  impuestos:{title:'Impuesto',fields:[['modelo','Modelo','select',0,[['130','130 (IRPF)'],['303','303 (IVA)'],['390','390 (IVA anual)'],['100','100 (Renta)'],['otro','Otro']]],['periodo','Periodo','text',0,null,'ej: 2026-T2'],['importe','Importe (€)','number'],['fecha_limite','Fecha límite','date'],['pagado','¿Pagado?','check'],['notas','Notas','textarea']]},
  pagos_proximos:{title:'Pago próximo',fields:[['concepto','Concepto','text',1],['importe','Importe (€)','number'],['fecha','Fecha','date'],['recurrente','Frecuencia','select',0,[['unico','Único'],['mensual','Mensual'],['trimestral','Trimestral'],['anual','Anual']]],['pagado','¿Pagado?','check'],['notas','Notas','textarea']]},
};
let editF={table:null,id:null,preset:{}};
function openForm(table,id,preset){
  editF={table,id:id||null,preset:preset||{}};
  const def=FORMS[table];const row=id?(cache[table]||[]).find(r=>r.id===id)||{}:{...editF.preset};
  const html=def.fields.map(f=>{const[k,label,type,req,opts,ph]=f;let v=row[k];
    if(type==='tags')v=arr(v).join(', ');
    if(type==='check')return `<div class="fg"><label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="f_${k}" ${v?'checked':''} style="width:auto"> ${label}</label></div>`;
    if(type==='select')return `<div class="fg"><label>${label}</label><select id="f_${k}">${opts.map(o=>`<option value="${o[0]}" ${v===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div>`;
    if(type==='textarea')return `<div class="fg"><label>${label}</label><textarea id="f_${k}" placeholder="${ph||''}">${esc(v||'')}</textarea></div>`;
    const t=type==='number'?'number':(type==='date'?'date':'text');
    return `<div class="fg"><label>${label}</label><input type="${t}" id="f_${k}" value="${esc(v??'')}" placeholder="${ph||''}"></div>`;}).join('');
  $('#modal').innerHTML=`<h3>${id?'✏️ Editar':'➕ Nuevo'} ${def.title.toLowerCase()}</h3>${html}
  <div class="modal-actions">${id?`<button class="btn-del" onclick="delForm()">🗑 Borrar</button>`:''}
  <button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn" onclick="saveForm()">Guardar</button></div>`;
  $('#overlay').classList.add('open');
  if(table==='movimientos'){const imp=document.getElementById('f_importe'),tip=document.getElementById('f_tipo'),am=document.getElementById('f_amort'),an=document.getElementById('f_amort_anios');
    const sync=()=>{if((parseFloat(imp.value)||0)>300&&tip.value==='gasto'){am.checked=true;if(!an.value)an.value=4;}};
    imp.addEventListener('input',sync);tip.addEventListener('change',sync);}
}
async function saveForm(){const{table,id,preset}=editF;const def=FORMS[table];const row={...preset};
  for(const f of def.fields){const[k,,type]=f;const el=document.getElementById('f_'+k);if(!el)continue;
    if(type==='check')row[k]=el.checked;else if(type==='tags')row[k]=arr(el.value);else if(type==='number')row[k]=parseFloat(el.value)||0;else row[k]=el.value;}
  if(def.fields.some(f=>f[3]&&!row[f[0]])){alert('Rellena los campos obligatorios.');return;}
  if(id)await db.update(table,id,row);else await db.insert(table,row);
  cache[table]=await db.list(table);migrate();updateCounts();closeModal();render();
}
async function delForm(){if(!confirm('¿Borrar esto?'))return;await db.remove(editF.table,editF.id);cache[editF.table]=await db.list(editF.table);migrate();updateCounts();closeModal();render();}
function closeModal(){$('#overlay').classList.remove('open');}
$('#overlay').addEventListener('click',e=>{if(e.target===$('#overlay'))closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
document.addEventListener('keydown',e=>{
  if(!editing||!$('#edBody')||$('#overlay').classList.contains('open'))return;
  const mod=e.ctrlKey||e.metaKey;if(!mod)return;
  if((e.key==='z'||e.key==='Z')&&!e.shiftKey){e.preventDefault();undoEditor();}
  else if(((e.key==='z'||e.key==='Z')&&e.shiftKey)||e.key==='y'||e.key==='Y'){e.preventDefault();redoEditor();}
});
// Ctrl/Cmd+Z global: deshace la última acción. Dentro de un campo de texto deja el deshacer nativo (palabra a palabra).
document.addEventListener('keydown',e=>{
  const mod=e.ctrlKey||e.metaKey;if(!mod||(e.key!=='z'&&e.key!=='Z')||e.shiftKey)return;
  if($('#overlay')&&$('#overlay').classList.contains('open'))return;       // modal con su propio flujo
  if(editing&&$('#edBody'))return;                                          // editor de guiones ya lo gestiona
  const el=document.activeElement;
  if(el&&(el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.isContentEditable))return; // deshacer nativo del campo
  e.preventDefault();appUndo();
});

  <p style="color:var(--mut);font-size:.83rem;line-height:1.6;margin-bottom:16px">Pega tus 2 claves de Supabase para guardar en la nube y sincronizar entre dispositivos. Guía: <code>SETUP_Supabase.md</code>.</p>
  <div class="fg"><label>Project URL</label><input id="cfg_url" placeholder="https://xxxx.supabase.co" value="${esc(cfg.url||'')}"></div>
  <div class="fg"><label>anon public key</label><input id="cfg_key" placeholder="eyJhbGci..." value="${esc(cfg.key||'')}"></div>
  <div style="font-size:.78rem;color:var(--mut);background:var(--inset);border:1px solid var(--line);border-radius:9px;padding:10px 12px">Estado: <b style="color:${CLOUD?'var(--green)':'var(--orange)'}">${CLOUD?'☁️ Conectado a la nube':'💾 Modo local'}</b></div>
  <div class="modal-actions">${CLOUD?'<button class="btn-del" onclick="disconnectCloud()">Desconectar</button>':''}<button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn" onclick="saveConfig()">Conectar y guardar</button></div>`;
  $('#overlay').classList.add('open');
}
async function saveConfig(){
  cfg={url:$('#cfg_url').value.trim(),key:$('#cfg_key').value.trim()};localStorage.setItem(CFG_KEY,JSON.stringify(cfg));initSupabase();
  if(CLOUD){const cloudIdeas=await db.list('ideas');const localIdeas=JSON.parse(localStorage.getItem('baseops_ideas')||'[]');
    if(cloudIdeas.length===0&&localIdeas.length>0&&confirm('¿Subir a la nube los datos de este navegador? (recomendado la 1ª vez)')){
      for(const t of TABLES){const local=JSON.parse(localStorage.getItem('baseops_'+t)||'[]');for(const r of local){const{id,created_at,...rest}=r;await sb.from(t).insert(rest);}}}}
  await refreshAll();closeModal();render();
}
function disconnectCloud(){if(!confirm('Volver a modo local. Tus datos en la nube se mantienen. ¿Seguir?'))return;cfg={};localStorage.removeItem(CFG_KEY);initSupabase();refreshAll().then(()=>{closeModal();render();});}

async function loginGoogle(){if(!sb)return;await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href.split('#')[0].split('?')[0]}});}
async function logout(){if(sb){try{await sb.auth.signOut();}catch(e){}}location.reload();}
async function startApp(){const sb1=document.querySelector('.sidebar');if(sb1)sb1.style.display='';const mt=document.querySelector('.mobile-top');if(mt)mt.style.display='';$('#main').style.maxWidth='';loadUI();setNavActive();await refreshAll();render();}

/* Auto-refresco: al volver a la pestaña + sondeo cada 30 s (siempre activo) */
let lastSync=Date.now();
function markSync(){const el=document.getElementById('syncInfo');if(el)el.textContent='Actualizado '+new Date().toLocaleTimeString('es-ES');}
async function softRefresh(force){
  if(!CLOUD||!authUser)return;
  if(!force&&Date.now()-lastSync<4000)return;   // anti-rebote
  if(editing)return;                             // no interrumpir el editor de guiones
  const ae=document.activeElement;               // no borrar lo que estés escribiendo
  if(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))return;
  lastSync=Date.now();
  await refreshAll();render();markSync();
}
window.addEventListener('focus',()=>softRefresh());
document.addEventListener('visibilitychange',()=>{if(!document.hidden)softRefresh();});
setInterval(()=>softRefresh(),30000);

/* BOOT */
(async function(){
  applyTheme();
  seedDemo(); initSupabase();
  // Modo previsualización local: al abrir el archivo (file://) se usa data demo y se salta el login, para iterar la interfaz rápido.
  if(location.protocol==='file:'){CLOUD=false;}
  if(CLOUD){
    try{
      const {data:{session}}=await sb.auth.getSession();
      if(session&&session.user){
        if((session.user.email||'').toLowerCase()===ALLOWED_EMAIL){authUser=session.user;await startApp();}
        else{await sb.auth.signOut();showLogin('La cuenta '+session.user.email+' no tiene acceso.');}
      } else showLogin();
    }catch(e){showLogin();}
  } else { await startApp(); }
})();
</script>
